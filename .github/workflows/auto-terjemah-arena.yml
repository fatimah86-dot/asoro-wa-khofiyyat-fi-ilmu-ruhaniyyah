name: AUTO TERJEMAH ASRAR 109%

on:
  workflow_dispatch:

jobs:
  buat-batch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Buat Batch Baru
        run: |
          mkdir -p terjemahan
          for B in 34 35 36 37 38 39 40; do
            HAL_START=$((160 + (B-33)*5))
            HAL_END=$((HAL_START+4))
            FILE="terjemahan/BATCH-${B}-Hal-${HAL_START}-${HAL_END}.md"
            if [ -f "$FILE" ]; then
              echo "Skip $FILE sudah ada"
              continue
            fi
            cat > "$FILE" <<EOF
          # BATCH-${B} Hal ${HAL_START}-${HAL_END}
          **5 Rajah HQ - Tilasm Lanjutan AUTO 109%**

          ### Instruksi Arena:
          - Baca Picture 001-149.jpg
          - OCR Arab gundul Hal ${HAL_START}-${HAL_END}
          - Terjemah gaya santri
          - 5 Rajah per batch

          **Status:** Menunggu isi Arena Agent - Arena tolong isi file ini!

          SELESAI AUTO - Batch ${B}
          EOF
            echo "Created $FILE"
          done

      - name: Commit
        run: |
          git config user.name "CangMay-Auto"
          git config user.email "fatimah86-dot@github.com"
          git add terjemahan/
          git diff --staged --quiet || git commit -m "AUTO Batch 34-40 - Fix 109% - Tilasm lanjutan"
          git push
