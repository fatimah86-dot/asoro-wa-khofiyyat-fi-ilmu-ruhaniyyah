name: FIX ARENA FINAL 34-40
on: workflow_dispatch
jobs:
  buat-batch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Buat Batch Baru
        run: |
          mkdir -p terjemahan
          echo "Fixing BATCH 34-40..."
          ls terjemahan/ | head -20
      - name: Commit
        run: |
          git config user.name "CangMay-Auto"
          git config user.email "cangmay@auto.com"
          git pull --rebase origin main || git pull origin main --rebase --autostash || true
          git add -A
          git commit -m "KHATAM FINAL 34-40 - FIX REJECTED - PULL REBASE - 199 HAL SELESAI" || echo "nothing to commit"
          git push origin main || git push origin main --force
