name: AUTO TERJEMAH ASRAR 109% + LATIN ARAB

on:
  workflow_dispatch:

jobs:
  buat-batch-latin-full:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update BATCH 01-33 Tambah Latin Arab
        run: |
          mkdir -p terjemahan
          
          # Update README untuk info Latin Arab
          cat > terjemahan/README-LATIN.md <<'MD'
          # Format Baru: Arab + Latin + Terjemah

          Setiap halaman sekarang ada 3 bagian:

          1. **Arab Gundul** (asli dari Picture)
          ```
          بسم الله الرحمن الرحيم
          ```

          2. **Latin Arab** (BARU!)
          ```
          Bismillahirrahmanirrahim
          ```

          3. **Terjemah Indonesia**
          Dengan menyebut nama Allah...

          ## Contoh Lengkap:
          ### Hal 001 - Picture 001.jpg
          **Arab:** بسم الله
          **Latin:** Bismillah
          **Terjemah:** Dengan nama Allah

          **Rajah 001:**
          - Gambar: Picture 001.jpg
          - Latin Rajah: Ya Budduh Ya Wadud
          - Khasiat: Mahabbah
          - Cara: Tulis di...

          Arena tolong update BATCH-01 sampai BATCH-33 dengan format Latin Arab ini!
          MD

          # Buat / update BATCH 01-33 dengan format Latin Arab (jika belum ada isi, tetap kerangka)
          for B in $(seq 1 33); do
            HAL_START=$((1 + (B-1)*5))
            HAL_END=$((HAL_START+4))
            PIC_START=$((1 + (B-1)*5))
            PIC_END=$((PIC_START+4))
            
            FILE="terjemahan/BATCH-$(printf "%02d" $B)-Hal-$(printf "%03d" $HAL_START)-$(printf "%03d" $HAL_END).md"
            
            # Jika file sudah ada dan sudah ada isinya (lebih dari 20 baris), skip biar tidak timpa terjemahan lama
            if [ -f "$FILE" ] && [ $(wc -l < "$FILE") -gt 20 ]; then
              echo "SKIP $FILE - sudah ada isi lama ($(wc -l < "$FILE") baris)"
              continue
            fi
            
            cat > "$FILE" <<EOF
          # BATCH-$(printf "%02d" $B) Hal $(printf "%03d" $HAL_START)-$(printf "%03d" $HAL_END) - LATIN ARAB 109%

          **5 Rajah HQ - Picture $(printf "%03d" $PIC_START)-$(printf "%03d" $PIC_END).jpg - Format: Arab + Latin + Terjemah**

          ## Instruksi Arena: Tambahkan Latin Arab!

          ### Hal $(printf "%03d" $HAL_START) - Picture $(printf "%03d" $PIC_START).jpg

          **Teks Arab Gundul:**
          \`\`\`
          [OCR Arab dari Picture $(printf "%03d" $PIC_START).jpg]
          \`\`\`

          **Latin Arab:**
          \`\`\`
          [Transliterasi latin dari Arab gundul di atas - BARU!]
          \`\`\`

          **Terjemah Indonesia:**
          [Terjemah gaya pesantren]

          **Rajah $(printf "%03d" $PIC_START):**
          - Gambar: ![Rajah $(printf "%03d" $PIC_START)](../Picture%20$(printf "%03d" $PIC_START).jpg)
          - **Latin Rajah:** [Tulis latin bacaan Rajah kotak]
          - Bentuk: [Kotak/bulat dengan angka Arab]
          - Khasiat: ...
          - Cara pakai: ...

          ---

          #### Hal $(printf "%03d" $((HAL_START+1))) - Picture $(printf "%03d" $((PIC_START+1))).jpg
          **Arab:** [OCR]
          **Latin:** [Transliterasi]
          **Terjemah:** ...

          **Status:** AUTO + LATIN ARAB - Menunggu Arena isi latin

          SELESAI BATCH-$(printf "%02d" $B) - Latin Arab 109%
          EOF
            echo "Created/Updated $FILE with Latin format"
          done

      - name: Commit Latin Arab Full
        run: |
          git config user.name "CangMay-Auto-Latin"
          git config user.email "fatimah86-dot@github.com"
          git add .
          git commit -m "AUTO TERJEMAH + LATIN ARAB 109% - Update BATCH 01-33 format Arab+Latin+Terjemah - Jangan timpa yang sudah ada isi" || echo "No changes"
          git push
