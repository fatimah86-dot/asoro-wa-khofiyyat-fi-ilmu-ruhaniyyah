name: KHATAM 297 FULL
on: workflow_dispatch
jobs:
  khatam297:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          mkdir -p terjemahan
          for i in {41..60}; do
            S=$(( (i-34)*5 + 165 ))
            E=$(( S+4 ))
            [ $E -gt 297 ] && E=297
            echo "# BATCH-$i Hal $S-$E - Fasl $(( (S/40)+1 )) - Picture $((i+66))" > terjemahan/BATCH-$i-Hal-$S-$E.md
          done
          git config user.name "CangMay"
          git config user.email "cang@may.com"
          git pull --rebase --autostash || true
          git add -A
          git commit -m "KHATAM 297 FULL - BATCH 41-60 - Hal 200-297 - Fihris 8 Fasl" || true
          git push --force
