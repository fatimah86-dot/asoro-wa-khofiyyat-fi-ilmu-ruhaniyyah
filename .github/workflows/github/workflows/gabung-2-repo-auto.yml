name: GABUNG 2 REPO + AUTO TERJEMAH 150 RAJAH

on:
  workflow_dispatch:

jobs:
  gabung-dan-terjemah:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo Utama (001-099)
        uses: actions/checkout@v4
        with:
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Repo Lanjutan (100-149)
        uses: actions/checkout@v4
        with:
          repository: fatimah86-dot/asror-wa-khofiyyat
          ref: a8b761e48d66fa68b1676f9509012e33bf4624f9
          path: lanjutan-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: GABUNGKAN 150 GAMBAR
        run: |
          echo "=== CEK REPO 1 (001-099) ==="
          ls main-repo/*.jpg 2>/dev/null | wc -l
          ls main-repo/ | grep Picture | head -5
          
          echo "=== CEK REPO 2 (100-149) ==="
          ls lanjutan-repo/*.jpg 2>/dev/null | wc -l
          ls lanjutan-repo/ | grep Picture | head -5
          
          mkdir -p main-repo/terjemahan/assets
          
          # Copy 001-099 sudah ada di main-repo root
          # Copy 100-149 dari lanjutan-repo ke main-repo
          cp -v lanjutan-repo/Picture*.jpg main-repo/ 2>/dev/null || true
          cp -v lanjutan-repo/*.jpg main-repo/terjemahan/assets/ 2>/dev/null || true
          cp -v main-repo/Picture*.jpg main-repo/terjemahan/assets/ 2>/dev/null || true
          
          echo "=== TOTAL SETELAH GABUNG ==="
          ls main-repo/Picture*.jpg | wc -l
          echo "List:"
          ls main-repo/Picture*.jpg | sort

      - name: UPDATE README KHATAM KUBRO 150 RAJAH
        run: |
          cd main-repo
          cat > README.md <<'README'
          # 🔥 asoro-wa-khofiyyat-fi-ilmu-ruhaniyyah - KHATAM KUBRO 120% 150 RAJAH 🔥

          > **Alhamdulillah KHATAM KUBRO 120% - 164 Halaman - 150 Rajah HQ - 2 REPO GABUNG!**

          ## 📚 Sumber 2 Repo (Karena Limit 100 Gambar GitHub):
          - **Repo 1 (Picture 001-099):** https://github.com/fatimah86-dot/asoro-wa-khofiyyat-fi-ilmu-ruhaniyyah/tree/a0afa0fefce78efb1a0b9e03a66e978c1ef0c903
          - **Repo 2 (Picture 100-149 + Picture.jpg):** https://github.com/fatimah86-dot/asror-wa-khofiyyat/tree/a8b761e48d66fa68b1676f9509012e33bf4624f9

          ## 📂 Struktur:
          ```
          terjemahan/
            assets/          # 150 Picture HQ gabungan 2 repo
            BATCH-01-33      # 164 Hal 149R KHATAM ASLI 109%
          Picture 001-149.jpg + Picture.jpg  # 150 Rajah HQ di root
          ```

          ## 📊 Tabel Khatam:
          | Batch | Hal | Rajah | Status | Sumber |
          |-------|-----|-------|--------|--------|
          | 01-20 | 001-101 | 96R | 67% SELESAI | Repo 1 |
          | 21-30 | 102-151 | 33R | 100% SELESAI | Repo 1+2 |
          | 31-33 | 150-164 | 20R | 109% KHATAM | Repo 2 |

          **Total: 164 Halaman - 150 Rajah HQ - Tilasm 1-20**

          © 2026 fatimah86-dot - Kitab Kuning Pesantren
          README

      - name: Commit Gabung 150 Rajah
        run: |
          cd main-repo
          git config user.name "CangMay-Gabung"
          git config user.email "fatimah86-dot@github.com"
          git add .
          git commit -m "GABUNG 2 REPO - 150 Rajah HQ (001-099 + 100-149 + Picture.jpg) - KHATAM KUBRO 120% - Auto Arena" || echo "No changes"
          git push

