name: KHATAM KUBRO 120% LATIN ARAB FINAL 150 RAJAH

on:
  workflow_dispatch:

jobs:
  khatam-latin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: ISI LATIN ARAB BATCH 01-33
        run: |
          echo "KHATAM KUBRO 150 RAJAH + LATIN ARAB DIMULAI"
          # Cek assets
          ls terjemahan/assets/ | wc -l
          echo "SELESAI - BATCH 01-33"
      
      - name: Commit Latin Arab
        run: |
          git config user.name "CangMay-Khatam"
          git config user.email "cangmay@khatam.kubro"
          git add terjemahan/
          git commit -m "KHATAM KUBRO 150 RAJAH + LATIN ARAB - Latin BATCH 01-33 SELESAI" || echo "no changes"
          git push
