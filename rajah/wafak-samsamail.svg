<text font-family="Amiri, Noto Naskh Arabic, serif" font-size="14" fill="#1a1208">
  <textPath href="#sm1" startOffset="50%" text-anchor="middle" direction="rtl">أَعُوذُ بِاللَّهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ ۞ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ</textPath>
